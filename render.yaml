services:
  - type: web
    name: miniredis
    runtime: docker
    plan: starter
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: MINIREDIS_DATA_FILE
        value: /tmp/miniredis.json
      - key: MINIREDIS_EXPIRY_SWEEP_MS
        value: "1000"
