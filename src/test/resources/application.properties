# Tests are hermetic: AOF is off, files live under target/ (gitignored).
quarkus.http.port=${PORT:8080}
quarkus.shutdown.timeout=5s

miniredis.data-file=${MINIREDIS_DATA_FILE:target/test-data/miniredis.json}
miniredis.expiry-sweep-ms=${MINIREDIS_EXPIRY_SWEEP_MS:1000}
miniredis.aof-file=${MINIREDIS_AOF_FILE:target/test-data/miniredis.aof}
miniredis.aof-fsync=everysec
miniredis.aof-enabled=false

quarkus.log.level=WARN
