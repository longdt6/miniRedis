quarkus.http.port=${PORT:8080}
quarkus.shutdown.timeout=5s

miniredis.data-file=${MINIREDIS_DATA_FILE:./data/miniredis.json}
miniredis.expiry-sweep-ms=${MINIREDIS_EXPIRY_SWEEP_MS:1000}
miniredis.aof-file=${MINIREDIS_AOF_FILE:./data/miniredis.aof}
miniredis.aof-fsync=${MINIREDIS_AOF_FSYNC:everysec}
miniredis.aof-enabled=${MINIREDIS_AOF_ENABLED:true}

quarkus.log.level=INFO
quarkus.log.category."com.example.miniredis".level=INFO
